[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darts"
description = "Phone-first darts scorekeeper for a Raspberry Pi on the home LAN"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
darts-gen-checkouts = "darts.tools.gen_checkouts:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[tool.hatch.version]
path = "backend/darts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/darts"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Generated by `darts-gen-checkouts`; its layout is the generator's business and
# `darts-gen-checkouts --check` is what keeps it honest. mypy still checks it.
extend-exclude = ["backend/darts/engine/checkout_table.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# `darts` is installed into the venv, so isort would otherwise file it as third-party.
[tool.ruff.lint.isort]
known-first-party = ["darts"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
files = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
