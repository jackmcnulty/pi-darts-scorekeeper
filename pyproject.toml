[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darts"
description = "Phone-first darts scorekeeper for a Raspberry Pi on the home LAN"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dynamic = ["version"]
dependencies = []

[project.scripts]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.version]
path = "backend/darts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/darts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
files = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
