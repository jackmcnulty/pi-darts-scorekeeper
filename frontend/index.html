<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, so the
         layout can hold itself clear of the Dynamic Island and home indicator.
         user-scalable=no because a pinch mid-leg only ever loses the keypad. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darts" />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="color-scheme" content="dark" />
    <!-- iOS ignores the manifest's icons and reads this instead. Every file
         named here is asserted into dist by src/pwa.test.ts: the server's SPA
         fallback answers a missing one with index.html under a 200, so a typo
         here would show up as a broken icon and never as a 404. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Darts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
