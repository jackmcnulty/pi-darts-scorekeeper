# The whole of /etc/samba/smb.conf on the Pi. Installed by bootstrap-pi.sh on
# every run, replacing Debian's stock file (kept once as smb.conf.debian-orig).
#
# One share, read-only, no password: `smb://darts.local/darts`. It exists so a
# Mac can open the data in DB Browser, DBeaver, TablePlus, DuckDB or pandas
# without copying anything off the Pi by hand. Ticket #30.
#
# Why the whole file rather than an include. Bookworm's Samba (4.17) has no
# smb.conf.d, and its stock file also advertises [homes], [printers] and
# [print$]. This share publishes data with no authentication on a home LAN, so
# the entire unauthenticated surface should be one file in the repository that a
# reviewer can read top to bottom -- not Debian's defaults plus ours.
#
# Why guest. The app itself has no authentication: anyone on this LAN can already
# score, abandon or export any match through the browser. A password on a
# read-only copy of the same data would be theatre, and a Samba password is one
# more secret to keep on a box that otherwise has none. docs/architecture.md
# records that assumption; exposing this box beyond the LAN would break it.
#
# Why the snapshot and never the live database. /var/lib/darts is not shared and
# must never be. Opening a WAL-mode database -- even read-only -- creates -wal and
# -shm sidecars owned by whoever opened it, which the container then cannot write
# (see the warning at the top of docs/deploy.md), and a desktop tool holding a
# lock on the live file could stall a game in progress. /srv/darts-share holds
# only darts-latest.db and snapshot.json, which the app republishes by rename
# (darts.services.snapshot): self-contained, no sidecar, never half-written.
#
# Why writes fail, in three independent ways, because "writing to the share
# fails" is a criterion and the first two are one typo from being wrong:
#   1. `read only = yes` on the share.
#   2. `guest only = yes`: every connection is the guest, so no credentials can
#      map to a user with more rights.
#   3. The filesystem: /srv/darts-share is 1000:1000 mode 755, and the guest is
#      `nobody`. Samba cannot grant what the kernel refuses.
#
# Validate after editing: `testparm -s /etc/samba/smb.conf`.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = Darts scorekeeper

   # Anyone who is not a known user -- which is everyone, since this box has no
   # Samba users -- becomes the guest account.
   map to guest = bad user
   guest account = nobody

   # Nothing else is shared: no printers, and no shares a user can define.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   usershare max shares = 0

   # Discovery is mDNS (Avahi advertises _smb._tcp), not NetBIOS, which macOS
   # has not needed for a decade. SMB2 and later only.
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB2_10

   # What makes Finder behave: `fruit` speaks Apple's SMB extensions, and
   # `streams_xattr` stores the alternate data streams Finder asks for. On a
   # read-only share nothing is ever stored, but without them Finder retries
   # and logs errors on every folder it opens.
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba

   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

[darts]
   comment = Darts snapshots: darts-latest.db and snapshot.json, every 5 minutes
   path = /srv/darts-share
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes

   # The app writes each snapshot to a dot-prefixed temporary beside the
   # published file and renames it into place. Vetoing them means a client can
   # never see, let alone open, a half-written copy.
   veto files = /.darts-*/
