name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Check immutable migrations and apply schema to temporary databases
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run pytest tests/db tests/fixtures -v

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy backend

      # checkout_table.py is committed, so it can drift from the generator.
      - name: Checkout table is up to date
        run: uv run darts-gen-checkouts --check

      - name: Test
        run: uv run pytest --cov=backend/darts --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  # Generating the client types needs Python and Node together, which is why
  # this is its own job rather than a step of `frontend`. It regenerates and
  # compares; it never writes, so a branch that forgot to commit schema.d.ts
  # fails here instead of quietly passing on a file CI made for itself.
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generated client types match the served OpenAPI schema
        working-directory: frontend
        run: npm run gen:api:check

  # The Pi runs linux/arm64 and this runner is amd64, so what this job proves is
  # that the Dockerfile is *coherent* -- the stages resolve, the lockfiles are
  # the ones in the tree, nothing references a renamed path -- and not that the
  # arm64 image works. That is deliberate: building arm64 under QEMU here would
  # cost minutes on every push to catch the same class of error. The native
  # arm64 build is a human step, recorded in docs/deploy.md.
  #
  # Nothing is pushed. The image is built and discarded.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image for linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  shell:
    name: shell
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: v3.10.0
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      # scripts/ and deploy/ may not exist or may hold no scripts yet; that is not a failure.
      - name: shellcheck
        run: |
          mapfile -t files < <(find scripts deploy -type f -name '*.sh' 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts under scripts/ or deploy/ — nothing to check."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

      - name: shfmt
        run: |
          mapfile -t files < <(find scripts deploy -type f -name '*.sh' 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts under scripts/ or deploy/ — nothing to check."
            exit 0
          fi
          shfmt -d -i 2 -ci "${files[@]}"
