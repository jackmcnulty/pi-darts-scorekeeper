name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy backend

      - name: Test
        run: uv run pytest --cov=backend/darts --cov-report=term-missing --cov-fail-under=85

  shell:
    name: shell
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: v3.10.0
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      # scripts/ and deploy/ may not exist or may hold no scripts yet; that is not a failure.
      - name: shellcheck
        run: |
          mapfile -t files < <(find scripts deploy -type f -name '*.sh' 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts under scripts/ or deploy/ — nothing to check."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

      - name: shfmt
        run: |
          mapfile -t files < <(find scripts deploy -type f -name '*.sh' 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts under scripts/ or deploy/ — nothing to check."
            exit 0
          fi
          shfmt -d -i 2 -ci "${files[@]}"
